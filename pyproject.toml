[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superman-security"
version = "0.1.0"
description = "Adaptive Red Team / Blue Team security automation agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["core", "core.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

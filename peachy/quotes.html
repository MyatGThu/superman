<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote of the Day — Peachy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">🍑 Peachy</a>
  <nav>
    <a href="eats.html">Eats &amp; Map</a><a href="discounts.html">Discounts</a>
    <a href="compare.html">Compare</a><a href="healthy.html">Healthy</a>
    <a href="quotes.html">Quotes</a>
  </nav>
</header>
<main>

<section class="hero">
  <span class="float" style="left:10%;top:14%" data-depth="0.35">📖</span>
  <span class="float" style="right:9%;top:10%" data-depth="0.45">🕊️</span>
  <h1 class="bubble lavender pop">Daily Courage</h1>
  <p class="lede reveal" style="margin:14px auto 0">One line a day from the
  book &amp; history archive. Same quote for everyone, all day.</p>
  <blockquote class="quote-big reveal" id="qod"></blockquote>
  <p class="quote-by reveal" id="qby"></p>
  <p class="reveal" style="margin-top:18px">
    <button class="pill" id="another" style="border:none;cursor:pointer;font-size:.95rem;padding:9px 18px">
      🎲 another one</button>
  </p>
</section>

<section class="card reveal">
  <h2 class="bubble peachy pop" style="font-size:1.6rem; margin-bottom:10px">The archive</h2>
  <div id="archive"></div>
</section>

</main>
<footer class="site">Public-domain lines from books &amp; history.</footer>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
const q = quoteOfDay();
document.getElementById("qod").textContent = "“" + q.text + "”";
document.getElementById("qby").textContent = "— " + q.by;
document.getElementById("another").onclick = () => {
  const r = QUOTES[Math.floor(Math.random() * QUOTES.length)];
  document.getElementById("qod").textContent = "“" + r.text + "”";
  document.getElementById("qby").textContent = "— " + r.by;
};
document.getElementById("archive").innerHTML = QUOTES.map(x =>
  `<blockquote class="mini">${x.text} <cite>— ${x.by}</cite></blockquote>`).join("");
</script>
</body></html>

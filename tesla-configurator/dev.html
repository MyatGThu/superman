<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head>
<body>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createModelY } from './car.js';
import { createEnvironment } from './environment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020204);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 2000);
camera.position.set(6.2, 2.0, 6.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);

const env = createEnvironment();
scene.add(env.group);
const car = await createModelY();
scene.add(car.group);
window.__debug = { car, env, scene, camera, controls, THREE };

const clock = new THREE.Clock();
(function loop() {
	requestAnimationFrame(loop);
	const dt = clock.getDelta();
	car.update(dt);
	env.update(dt);
	controls.update();
	renderer.render(scene, camera);
})();
</script>
</body>
</html>
